name: BinX CI

on:
  push:
    branches: [main, "v1.0"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev
      - name: Configure
        run: cmake -S . -B build/gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/gcc --parallel 2
      - name: Test
        run: ctest --test-dir build/gcc --output-on-failure

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libssl-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build/clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/clang --parallel 2
      - name: Test
        run: ctest --test-dir build/clang --output-on-failure

  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libssl-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON -DBINX_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build/asan --parallel 2
      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release

  windows-msvc-sanitized:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DBUILD_TESTING=ON -DBINX_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build-asan -C Debug --output-on-failure
